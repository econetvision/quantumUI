# Production compose — the self-hosted alternative to Vercel + Railway, for
# when the whole stack has to run on one box. Mirrors
# erp_project_amm/docker-compose.prod.yml.
#
#   APP_VERSION=1.2.0 BUILD_SHA=$(git rev-parse HEAD) \
#   BUILD_TIME=$(date -u +%FT%TZ) docker compose -f docker-compose.prod.yml up -d --build
#
# Required: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, AUTH_SECRET,
# PUBLIC_ORIGIN, EXECUTOR_API_KEY.
#
# Compose interpolates ${...} from the shell and from `.env` ONLY — it never
# reads `.env.local`, which is where this repo keeps its secrets. Pass it
# explicitly, or the values silently resolve to their defaults:
#
#   docker compose --env-file .env.local --env-file .env \
#     -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: quantumui_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - quantumui-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: quantumui_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      QUANTUM_EXECUTOR_URL: http://quantum-executor:8080
      EXECUTOR_API_KEY: ${EXECUTOR_API_KEY:?set EXECUTOR_API_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 48)}
    depends_on:
      db:
        condition: service_healthy
      quantum-executor:
        condition: service_healthy

  quantum-executor:
    build:
      # Repo root — the Dockerfile's COPY paths are repo-root-relative.
      context: .
      dockerfile: quantum-executor/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: quantumui_executor
    restart: always
    environment:
      PYTHONUNBUFFERED: 1
      EXECUTOR_API_KEY: ${EXECUTOR_API_KEY:?set EXECUTOR_API_KEY in .env}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-15}
      EXECUTE_RATE_LIMIT: ${EXECUTE_RATE_LIMIT:-30}
      # Must match the browser-visible origin exactly, scheme included, or every
      # circuit run is blocked by CORS.
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      QPIAI_API_KEY: ${QPIAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  quantumui-db:
