name: Deploy Frontend to Vercel

# Production deploy for the Next.js app.
#
# Three things guard production here, in order:
#   1. CI must pass — the whole ci.yml suite runs as a gate, not alongside.
#   2. The commit must actually BE this codebase (see "Guard"). The repository
#      contains a second, unrelated history whose main branch is the old MySQL
#      version of this project; deploying it would replace the live site with
#      an app that cannot reach the database.
#   3. The deployment must answer correctly afterwards, or it is rolled back.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vercel.json'
      - '.github/workflows/deploy-frontend-vercel.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  # Deliberately NOT cancel-in-progress: killing a half-finished production
  # deploy is how you end up serving a partially-swapped build.
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  ci:
    name: Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Vercel
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD_URL: ${{ vars.PRODUCTION_URL || 'https://www.sroobservotary.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — production deploys come from main only
        # `branches:` already limits the push trigger, but workflow_dispatch can
        # be fired from any ref in the UI. Without this, "Run workflow" on a
        # feature branch would put unreviewed work straight into production.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Refusing to deploy ${{ github.ref }}. Production deploys run from main only."
          exit 1

      # ---------------------------------------------------------------------
      # Guard: refuse to deploy a commit that is not this application.
      #
      # `git log origin/main` shares no ancestor with the deployed history —
      # it is a different, older project that happens to live in the same
      # repository. Its schema targets MySQL and it still uses the pre-Next-16
      # src/middleware.ts. Either marker means "this is not what production
      # runs", and shipping it would take the site down rather than update it.
      # ---------------------------------------------------------------------
      - name: Guard — verify this is the production codebase
        run: |
          fail() { echo "::error::$1"; exit 1; }
          grep -q 'provider *= *"postgresql"' prisma/schema.prisma \
            || fail "prisma/schema.prisma is not PostgreSQL — refusing to deploy (looks like the stale MySQL history)."
          [ -f src/proxy.ts ] \
            || fail "src/proxy.ts is missing — refusing to deploy (pre-Next-16 tree)."
          [ -f next.config.ts ] || fail "next.config.ts is missing — not a deployable tree."
          echo "Guard passed: PostgreSQL schema and src/proxy.ts present."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Recorded BEFORE the deploy so the rollback step has somewhere to go
      # back to. `vercel inspect` prints the deployment currently serving the
      # production alias.
      - name: Record the deployment currently in production
        id: prev
        run: |
          id=$(npx vercel inspect "$PROD_URL" --token="$VERCEL_TOKEN" 2>&1 \
                | awk '$1 == "id" { print $2; exit }')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Current production deployment: ${id:-<none found>}"

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # ---------------------------------------------------------------------
      # Schema, before the code that reads it.
      #
      # Nothing here used to apply migrations, so a merge whose code expected
      # new columns deployed against a database that did not have them. That
      # is not hypothetical: #7 added AnalyticsEvent, lastLoginAt and
      # loginCount, deployed green, and every request that touched User threw
      # until the columns were added by hand.
      #
      # `migrate deploy` only ever applies committed migration files forward.
      # It will not generate, reset, or drop anything, so a schema edit that
      # arrives without a migration file fails the deploy loudly here instead
      # of silently at runtime.
      # ---------------------------------------------------------------------
      # Credentials come from the Vercel environment pulled in the previous
      # step, not from a separate GitHub secret. One source of truth: if the
      # deployment can reach the database, so can this step, and the two can
      # never drift apart the way two copies of a connection string do.
      # ---------------------------------------------------------------------
      # Schema, before the code that reads it.
      #
      # Two failures shaped this step. First, nothing applied migrations at all,
      # so #7 shipped code that threw on every request touching User. Second,
      # the fix depended on DIRECT_URL, which was stored on Vercel as a
      # *sensitive* variable — and Vercel never returns those, so `vercel pull`
      # wrote it as an empty string and the deploy failed twice with P1013.
      #
      # Hence: resolve across every candidate Neon publishes, report what was
      # found without printing any of it, and treat "no usable URL" as a
      # warning rather than a blocked deploy. The smoke test below still makes
      # a real database call and rolls back if the schema and the code
      # disagree, so skipping here degrades to the previous safety net instead
      # of shipping blind.
      # ---------------------------------------------------------------------
      - name: Apply database migrations
        run: |
          set -a; . ./.vercel/.env.production.local; set +a

          usable() { case "$1" in postgres://*|postgresql://*) return 0;; *) return 1;; esac; }

          echo "candidates pulled from the Vercel environment:"
          direct=""
          for name in DIRECT_URL DATABASE_URL_UNPOOLED POSTGRES_URL_NON_POOLING DATABASE_URL; do
            eval "value=\${$name-}"
            scheme="${value%%:*}"
            printf '  %-26s length=%-4s scheme=%s\n' "$name" "${#value}" "${scheme:-<empty>}"
            if [ -z "$direct" ] && usable "$value"; then direct="$value"; chosen="$name"; fi
          done

          if [ -z "$direct" ]; then
            echo "::warning::No usable database URL in the pulled Vercel environment, so migrations were skipped. If a migration is pending, the smoke test will fail on the database check and roll this deploy back. Check that DIRECT_URL is not marked 'sensitive' — Vercel never returns the value of sensitive variables."
            exit 0
          fi

          echo "migrating with $chosen against $(echo "$direct" | sed 's|.*@||;s|/.*||')"
          DIRECT_URL="$direct" npx prisma migrate deploy

          # `migrate deploy` succeeds when there is nothing to apply, including
          # when someone edited schema.prisma and forgot the migration. This is
          # the check that catches that.
          if DIRECT_URL="$direct" npx prisma migrate diff \
               --from-url "$direct" \
               --to-schema-datamodel prisma/schema.prisma \
               --exit-code > /dev/null 2>&1; then
            echo "Schema matches the database."
          else
            echo "::error::schema.prisma does not match the database. Generate a migration with 'prisma migrate dev --name <change>' and commit it."
            DIRECT_URL="$direct" npx prisma migrate diff --from-url "$direct" --to-schema-datamodel prisma/schema.prisma --script
            exit 1
          fi

      # Canonical URLs, Open Graph tags and the JSON-LD blocks are all resolved
      # at build time from NEXT_PUBLIC_SITE_URL. A --prebuilt build in CI does
      # not receive Vercel's own system variables, so when this is missing the
      # whole site ships with http://localhost:3000 baked into every tag. That
      # shipped once already, silently, because nothing checked.
      - name: Verify the public site URL is present
        run: |
          set -a; . ./.vercel/.env.production.local; set +a
          case "${NEXT_PUBLIC_SITE_URL-}" in
            https://*) echo "NEXT_PUBLIC_SITE_URL = $NEXT_PUBLIC_SITE_URL" ;;
            *) echo "::error::NEXT_PUBLIC_SITE_URL is missing or not https, so every canonical and Open Graph tag would be built against localhost. If it is set on Vercel, check it is not marked 'sensitive' — those are never returned to a build."; exit 1 ;;
          esac

      - name: Build
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      # ---------------------------------------------------------------------
      # Put the new build in front of traffic, and prove it got there.
      #
      # `vercel rollback` pins the production alias to the deployment it
      # reverted to. Every later `vercel deploy --prod` then builds, uploads
      # and reports success while the alias keeps serving the pinned build —
      # the deploy is green and the site never changes. That happened here: a
      # failed deploy rolled back, and the three successful deploys after it
      # were invisible in production for hours.
      #
      # It is worse than a silent no-op, because the smoke test below requests
      # PROD_URL. Against a pinned alias it tests the *old* deployment and
      # passes, certifying a build that is not serving. So: promote, then
      # assert that the deployment answering PROD_URL is the one just built.
      # ---------------------------------------------------------------------
      - name: Promote to production and verify the alias moved
        run: |
          serving() {
            npx vercel inspect "$PROD_URL" --token="$VERCEL_TOKEN" 2>&1 \
              | awk '$1 == "url" { print $2; exit }'
          }
          new="${{ steps.deploy.outputs.url }}"
          new="${new#https://}"

          if [ "$(serving)" = "$new" ]; then
            echo "Production alias already points at the new deployment."
            exit 0
          fi

          echo "Alias is not on the new deployment — promoting (production was pinned)."
          npx vercel promote "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN" --timeout 5m

          for attempt in 1 2 3 4 5 6; do
            [ "$(serving)" = "$new" ] && { echo "Alias now serves $new"; exit 0; }
            echo "alias not moved yet (attempt $attempt), waiting 10s"; sleep 10
          done

          echo "::error::$PROD_URL still serves $(serving), not the new deployment $new. Production is pinned; the smoke test below would have tested the wrong build."
          exit 1

      # ---------------------------------------------------------------------
      # Smoke test. A green `vercel deploy` only means the build shipped; it
      # says nothing about whether the site answers. Each check below maps to
      # something that has actually broken this app before:
      #   /            — the build renders at all
      #   /login       — a public route serves
      #   /tracks      — 307, proving the proxy reads the session cookie
      #                  (it silently stopped doing so once, and every
      #                  signed-in user was bounced back to /login)
      #   /api/quantum/execute — the API route runs and env vars resolved
      # ---------------------------------------------------------------------
      - name: Smoke test production
        id: smoke
        run: |
          fail() { echo "::error::$1"; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$1"; }

          for attempt in 1 2 3 4 5; do
            [ "$(code "$PROD_URL/")" = "200" ] && break
            echo "root not ready (attempt $attempt), waiting 10s"; sleep 10
          done

          [ "$(code "$PROD_URL/")" = "200" ]      || fail "GET / did not return 200"
          [ "$(code "$PROD_URL/login")" = "200" ] || fail "GET /login did not return 200"

          gated=$(code "$PROD_URL/tracks")
          [ "$gated" = "307" ] || fail "GET /tracks returned $gated, expected 307 — route protection is not working"

          body=$(curl -s --max-time 45 "$PROD_URL/api/quantum/execute")
          echo "$body" | grep -q '"status"' \
            || fail "/api/quantum/execute did not return a status payload: $body"

          # The database, which nothing above touches. Every check before this
          # one passes on a deployment whose Prisma client cannot start: static
          # pages render, /tracks still 307s (the proxy only reads a cookie),
          # and the executor is a separate service. A --prebuilt deploy built on
          # a different Linux than Vercel's runtime shipped exactly that, and
          # this smoke test called it healthy while every account feature was
          # dead.
          #
          # Registering an address that already exists is a read with no side
          # effect: 409 when the database answers, 503 when it does not.
          db=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 \
            -X POST "$PROD_URL/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@quantumui.local","password":"smoke-test-not-used","name":"smoke"}')
          [ "$db" = "409" ] || fail "database unreachable from the deployment: /api/auth/register returned $db, expected 409"

          echo "Smoke test passed. Database reachable. Executor reported: $body"

      # Only fires if the smoke test failed. Puts the previous deployment back
      # in front of traffic rather than leaving a broken build serving.
      - name: Roll back on smoke-test failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.id != ''
        run: |
          echo "::warning::Smoke test failed — rolling back to ${{ steps.prev.outputs.id }}"
          npx vercel rollback "${{ steps.prev.outputs.id }}" --token="$VERCEL_TOKEN" --timeout 5m
          echo "### Rolled back" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke test failed; production was reverted to \`${{ steps.prev.outputs.id }}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Frontend deployed"
            echo "commit \`${{ github.sha }}\`"
            echo "verified live at $PROD_URL"
          } >> "$GITHUB_STEP_SUMMARY"
