name: Deploy Backend to Railway

# Production deploy for the FastAPI quantum executor. Vercel cannot run it —
# it is a container — so it lives on Railway and the Next.js app calls it over
# HTTPS via QUANTUM_EXECUTOR_URL.
#
# Same three guards as the frontend deploy: CI gates it, a codebase check stops
# the unrelated stale history from shipping, and the executor has to actually
# answer afterwards.

on:
  push:
    branches: [main]
    paths:
      - 'quantum-executor/**'
      - 'railway.json'
      - '.github/workflows/deploy-backend-railway.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  ci:
    name: Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Railway
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      # Railway has two token kinds and the CLI reads them from different
      # variables: RAILWAY_TOKEN must be a *project* token, RAILWAY_API_TOKEN an
      # *account* one. An account token placed in RAILWAY_TOKEN fails with
      # "Invalid RAILWAY_TOKEN", which reads like a bad secret rather than the
      # wrong kind of secret. Both are passed, so whichever exists is used.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      # Public hostname of the executor. Falls back to the service's generated
      # Railway domain so the health check still runs when the secret is unset —
      # previously it was wrapped in `if: secrets.RAILWAY_PUBLIC_URL != ''`, so a
      # missing secret silently skipped verification and a dead executor
      # reported success.
      EXECUTOR_URL: ${{ vars.RAILWAY_PUBLIC_URL || 'https://quantum-executor-production-113a.up.railway.app' }}
      PROD_URL: ${{ vars.PRODUCTION_URL || 'https://www.sroobservotary.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — production deploys come from main only
        # `branches:` already limits the push trigger, but workflow_dispatch can
        # be fired from any ref in the UI. Without this, "Run workflow" on a
        # feature branch would put unreviewed work straight into production.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Refusing to deploy ${{ github.ref }}. Production deploys run from main only."
          exit 1

      - name: Guard — verify this is the production codebase
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f quantum-executor/main.py ] || fail "quantum-executor/main.py missing — not a deployable tree."
          [ -f railway.json ] || fail "railway.json missing — Railway would guess the build."
          grep -q 'quantum-executor/Dockerfile' railway.json \
            || fail "railway.json no longer points at quantum-executor/Dockerfile."
          echo "Guard passed."

      - name: Check a Railway token is present
        run: |
          if [ -z "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::No Railway token set. RAILWAY_TOKEN takes a project token (quantum-executor -> Settings -> Tokens); RAILWAY_API_TOKEN takes an account token (Account Settings -> Tokens). Railway recommends a project token for deploys."
            exit 1
          fi
          [ -n "$RAILWAY_TOKEN" ] && echo "RAILWAY_TOKEN set - must be a PROJECT token."
          [ -n "$RAILWAY_API_TOKEN" ] && echo "RAILWAY_API_TOKEN set - must be an ACCOUNT token."
          exit 0

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | bash
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - run: railway --version

      - name: Deploy
        env:
          APP_VERSION: ${{ github.ref_name }}-${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: railway up --service ${{ vars.RAILWAY_SERVICE || 'quantum-executor' }} --ci

      # Unconditional. /health answering is the minimum bar for calling this
      # deploy successful.
      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if body=$(curl -fsS --max-time 30 "$EXECUTOR_URL/health"); then
              echo "$body"
              echo "$body" | grep -q '"status":"healthy"' \
                && { echo "Executor healthy."; exit 0; }
              echo "::warning::/health answered but not healthy: $body"
            fi
            echo "attempt $attempt failed, retrying in 10s"; sleep 10
          done
          echo "::error::Executor did not become healthy at $EXECUTOR_URL"; exit 1

      # /health answers even when the app cannot use the executor — a mismatched
      # EXECUTOR_API_KEY between Railway and Vercel returns 401 on every real
      # call while /health stays green. This checks the path that actually
      # matters: the deployed app reaching the deployed executor.
      - name: Verify the app can reach the executor
        run: |
          body=$(curl -s --max-time 45 "$PROD_URL/api/quantum/execute")
          echo "$body"
          echo "$body" | grep -q '"status":"connected"' && { echo "App ↔ executor OK."; exit 0; }
          echo "::error::App reports the executor as unreachable. Usual cause: EXECUTOR_API_KEY differs between Railway and Vercel, or QUANTUM_EXECUTOR_URL is unset/stale."
          exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "### Executor deployed"
            echo "commit \`${{ github.sha }}\`"
            echo "healthy at $EXECUTOR_URL and reachable from $PROD_URL"
          } >> "$GITHUB_STEP_SUMMARY"
