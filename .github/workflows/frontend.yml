name: Frontend

on:
  push:
    branches: [main]
    # GitHub Actions does not support YAML anchors, so this list is repeated
    # verbatim under pull_request. Keep the two in sync.
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'postcss.config.mjs'
      - 'next-env.d.ts'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'postcss.config.mjs'
      - 'next-env.d.ts'
      - '.github/workflows/frontend.yml'

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Next.js app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Prisma client is generated code; without this the type-check fails
      # on every model reference.
      - run: npx prisma generate

      - name: Lint
        run: npx eslint src

      - name: Build (includes type-check)
        run: npm run build
        env:
          # Build-time only. Prisma needs a parseable URL to generate against;
          # nothing connects during `next build`.
          DATABASE_URL: mysql://user:pass@localhost:3306/quantumui
          AUTH_SECRET: ci-build-only-secret-not-used-at-runtime

  content:
    name: Question bank integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate the question bank
        run: |
          python - <<'PY'
          import json, sys

          bank = json.load(open('src/data/labs/lab-questions.json'))
          questions = [q for t in bank['topics'] for q in t['questions']]

          problems = []
          ids = [q['id'] for q in questions]
          if len(ids) != len(set(ids)):
              problems.append('duplicate question ids')

          for q in questions:
              if not (q.get('title') or '').strip():
                  problems.append(f"{q['id']}: empty title")
              if not q.get('explanation'):
                  problems.append(f"{q['id']}: missing explanation")
              if q.get('difficulty') not in ('easy', 'medium', 'complex'):
                  problems.append(f"{q['id']}: bad difficulty {q.get('difficulty')!r}")

          print(f'{len(questions)} questions across {len(bank["topics"])} topics')
          if problems:
              print('\n'.join(f'  {p}' for p in problems[:25]))
              sys.exit(1)
          print('question bank OK')
          PY
