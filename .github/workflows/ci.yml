name: CI

# `workflow_call` lets the deploy workflows run these same checks as a gate
# before they touch production, instead of deploying in parallel with them and
# finding out afterwards. Nothing here needs a secret, so callers do not pass any.
on:
  push:
    branches: [main, clean-main, 'feat/**']
  pull_request:
  workflow_call:

concurrency:
  # A new push supersedes an in-flight run on the same branch. Safe here — these
  # jobs only read. The deploy workflows deliberately do NOT cancel in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Next.js app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Prisma client is generated code; without this the type-check fails
      # on every model reference.
      - run: npx prisma generate

      - name: Lint
        run: npx eslint src

      - name: Build (includes type-check)
        run: npm run build
        env:
          # Build-time only. Prisma needs a parseable URL to generate against;
          # nothing connects during `next build`.
          DATABASE_URL: postgresql://user:pass@localhost:5432/quantumui
          DIRECT_URL: postgresql://user:pass@localhost:5432/quantumui
          AUTH_SECRET: ci-build-only-secret-not-used-at-runtime

  executor:
    name: Quantum executor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-executor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quantum-executor/requirements.txt

      - run: pip install -r requirements.txt

      - name: Sandbox escape regression tests
        run: python test_sandbox.py

      - name: Import check
        run: python -c "import main, catalog, qpiai_bridge, mock_circuit; print('modules import cleanly')"

      - name: Verify the SDK actually executes a circuit
        run: |
          python - <<'PY'
          import catalog
          # A Bell state must produce only |00> and |11>. This catches an SDK
          # upgrade silently changing behaviour — the Phi/Psi labels were
          # transposed upstream once already.
          result = catalog.run_algorithm('bell', {'state_type': '|Φ+>'}, shots=512)
          outcomes = sorted(result['counts'])
          assert outcomes == ['00', '11'], f'Bell |Φ+> gave {outcomes}, expected 00/11'
          print('Bell state correct:', result['counts'])
          PY

      # Built from the repository root, NOT from quantum-executor/. The
      # Dockerfile's COPY paths are repo-root-relative because that is the
      # context Railway uses (railway.json -> dockerfilePath).
      - name: Docker image builds
        working-directory: .
        run: docker build -f quantum-executor/Dockerfile -t quantum-executor .

  content:
    name: Question bank integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate the question bank
        run: |
          python - <<'PY'
          import json, re, sys

          bank = json.load(open('src/data/labs/lab-questions.json'))
          questions = [q for t in bank['topics'] for q in t['questions']]

          problems = []
          ids = [q['id'] for q in questions]
          if len(ids) != len(set(ids)):
              problems.append('duplicate question ids')

          for q in questions:
              if not (q.get('title') or '').strip():
                  problems.append(f"{q['id']}: empty title")
              if not q.get('explanation'):
                  problems.append(f"{q['id']}: missing explanation")
              if q.get('difficulty') not in ('easy', 'medium', 'complex'):
                  problems.append(f"{q['id']}: bad difficulty {q.get('difficulty')!r}")

              # Every question must have a hint and an answer of some kind.
              # Both reached full coverage deliberately; without a gate the next
              # import quietly drops back and nobody notices until a learner is
              # stuck with no way forward.
              if not (q.get('hint') or '').strip():
                  problems.append(f"{q['id']}: missing hint")
              if not ((q.get('solution') or '').strip() or (q.get('workedSolution') or '').strip()):
                  problems.append(f"{q['id']}: no solution and no worked answer")

              # A prompt that is only "Task 3" is an extraction failure, not a
              # question. Nine of these shipped as real questions before.
              body = re.sub(r'^\\s*#*\\s*Task\\s*\\d*\\s*:?\\s*', '',
                            ' '.join((q.get('prompt') or '').split()), flags=re.I).strip(' ()')
              if len(body) < 10:
                  problems.append(f"{q['id']}: prompt has no content ({q.get('prompt')!r})")

          print(f'{len(questions)} questions across {len(bank["topics"])} topics')
          if problems:
              print('\n'.join(f'  {p}' for p in problems[:25]))
              sys.exit(1)
          print('question bank OK')
          PY
